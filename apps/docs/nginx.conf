server {
  listen 80;
  root /usr/share/nginx/html;
  # Behind the proxy, redirects stay relative (no http:// or :80 leaking into Location).
  absolute_redirect off;
  charset utf-8;
  charset_types text/html text/plain text/markdown text/css application/javascript application/json image/svg+xml;

  # Pages are exported as /docs/guide.html for /docs/guide.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
  error_page 404 /404.html;

  # The docs start at Start here.
  location = /docs { return 302 /docs/start; }

  # Per-page Markdown for "Copy Markdown" and "Open in ChatGPT / Claude".
  location ~ \.md$ {
    default_type text/markdown;
  }
  location ~ ^/llms(-full)?\.txt$ {
    default_type text/plain;
  }
  # The search index is exported without an extension.
  location = /api/search {
    default_type application/json;
  }
  location /og/ {
    add_header Cache-Control "public, max-age=3600";
  }
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
