packages:
  - apps/*
  - packages/*

# Supply-chain guard: never install a version published less than a day ago.
minimumReleaseAge: 1440

# Only these packages may run install scripts.
allowBuilds:
  esbuild: true
  "@reown/appkit": false
  keccak: false
  sharp: true
  bufferutil: false
  secp256k1: false
  utf-8-validate: false

# One version per shared dependency across apps and packages.
catalog:
  typescript: 7.0.2
  "@types/node": 24.19.2
  tsx: 4.23.15
  zod: 4.6.7
  drizzle-orm: 0.45.4
  postgres: 3.4.9
  pg-boss: 12.38.1
  near-api-js: 7.4.0
  "@noble/hashes": 2.4.0
  "@scure/base": 2.4.0
